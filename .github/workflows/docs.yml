name: Update CypherDocs

on:
  push:
    paths:
      - "docs/**/*.md"

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out CypherGate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for real documentation changes
        id: docs
        shell: bash
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            -- docs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CypherDocs build
        if: steps.docs.outputs.changed == 'true'
        env:
          CYPHERDOCS_TOKEN: ${{ secrets.CYPHERDOCS_TOKEN }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url https://api.github.com/repos/Cypher-Monarch/CypherDocs/actions/workflows/docs.yml/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${CYPHERDOCS_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}'
